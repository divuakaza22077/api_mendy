name: API-Mend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run Ruff
        run: python -m ruff check backend tests
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Install JavaScript tooling
        run: npm ci
      - name: Verify Oxlint binary
        run: npm exec -- oxlint --version
